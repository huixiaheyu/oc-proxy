services:
  oc-proxy:
    build: .
    container_name: oc-proxy
    restart: unless-stopped
    ports:
      # 宿主机端口:容器端口，按需改左侧
      - "20128:20128"
    environment:
      # 对外 API Key 初始值（前端页面会展示，客户端调用 /v1/* 需带此 key）
      # 改成你自己的强密码；部署后也可在网页「接入信息」页点「设置」动态修改并持久化
      - API_KEY=sk_oc_proxy
      # 若设为 true 则跳过 API Key 校验（仅内网/本机调试用，不建议公网开启）
      - ALLOW_PUBLIC_API=false
      # 模型列表缓存时长（毫秒），默认 10 分钟
      # - MODEL_CACHE_TTL_MS=600000
    volumes:
      # 持久化上游配置（网页里添加的自定义上游存这里）
      - ./data:/app/data
    # 可选：配置日志限制
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
